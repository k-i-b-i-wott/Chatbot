<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-content">
                <div class="header-main">
                    <i class="fas fa-user-md"></i>
                    <div class="header-text">
                        <h1>Medical Assistant</h1>
                        <p>Ask me anything about Dental topics</p>
                    </div>
                </div>
                <button id="clearButton" class="header-clear-button" type="button">
                    <i class="fas fa-trash-alt"></i>
                    <span>Clear chat</span>
                </button>
            </div>
        </div>
        
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">
                <div class="message-content">
                    <i class="fas fa-robot"></i>
                    <p>Hello! I'm your medical assistant. How can I help you today?</p>
                </div>
            </div>
        </div>
        
        <div class="chat-input-container">
            <form id="chatForm" class="chat-form">
                <div class="input-group">
                    <input type="text" id="messageInput" placeholder="Type your medical question here..." autocomplete="off">
                    <button type="submit" id="sendButton">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const chatMessages = document.getElementById('chatMessages');
        const sendButton = document.getElementById('sendButton');
        const clearButton = document.getElementById('clearButton');

        function addMessage(content, isBot = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isBot ? 'bot-message' : 'user-message'}`;
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            if (isBot) {
                const icon = document.createElement('i');
                icon.className = 'fas fa-robot';
                messageContent.appendChild(icon);
            }
            
            const text = document.createElement('p');
            text.textContent = content;
            messageContent.appendChild(text);
            
            messageDiv.appendChild(messageContent);
            chatMessages.appendChild(messageDiv);
            
            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function setLoading(loading) {
            sendButton.disabled = loading;
            messageInput.disabled = loading;
            if (loading) {
                sendButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            } else {
                sendButton.innerHTML = '<i class="fas fa-paper-plane"></i>';
            }
        }

        function clearChat() {
            chatMessages.innerHTML = '';
            addMessage("Hello! I'm your medical assistant. How can I help you today?", true);
        }

        clearButton.addEventListener('click', () => {
            clearChat();
            messageInput.focus();
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message
            addMessage(message, false);
            
            // Clear input
            messageInput.value = '';
            
            // Set loading state
            setLoading(true);
            
            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addMessage(data.response, true);
                } else {
                    // Show the actual error message for debugging
                    const errorMsg = data.error || data.details || 'Sorry, I encountered an error. Please try again.';
                    console.error('Server error:', data);
                    addMessage(`Error: ${errorMsg}`, true);
                }
            } catch (error) {
                console.error('Error:', error);
                addMessage(`Sorry, I encountered an error: ${error.message}. Please check the console for details.`, true);
            } finally {
                setLoading(false);
            }
        });

        // Allow Enter key to submit
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
